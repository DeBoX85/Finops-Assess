[project]
name = "fcat"
version = "0.1.0"
description = "F-CAT: read-only Azure FinOps assessment (work in progress)"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
azure = ["azure-identity"]
excel = ["openpyxl"]
dev = ["pytest", "pytest-cov", "openpyxl", "jsonschema", "ruff", "hypothesis", "mypy", "pytest-randomly"]
[project.scripts]
fcat = "fcat.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["live: needs a real Azure test tenant and az login (read-only); skipped by default"]
addopts = "-m \"not live\""

[tool.ruff]
line-length = 140
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["E501", "S101"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011"]
"scripts/*" = ["S603", "S607", "S101"]
"src/fcat/checks_builtin.py" = []
[tool.coverage.run]
source = ["src/fcat"]
[tool.coverage.report]
fail_under = 85

[tool.mypy]
python_version = "3.11"
files = ["src/fcat"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*", "azure", "azure.*"]
ignore_missing_imports = true
