[project]
name = "fcat"
version = "0.1.0"
description = "F-CAT: read-only Azure FinOps assessment (work in progress)"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
azure = ["azure-identity"]
dev = ["pytest"]
[project.scripts]
fcat = "fcat.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
